[metadata]
name = invenio-geographic-identifiers
version = attr: invenio_geographic_identifiers.__version__
description = InvenioRDM module for the Geographic identifiers vocabularies.
long_description = file: README.md
long_description_content_type = text/markdown
keywords = invenio geographic-identifiers geographic geospatial
license = MIT
author = GEO Secretariat
author_email = secretariat@geosec.org
platforms = any
url = https://github.com/geo-knowledge-hub/invenio-geographic-identifiers
classifiers =
    Environment :: Web Environment
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python
    Topic :: Software Development :: Libraries :: Python Modules
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
include_package_data = True
packages = find:
python_requires = >=3.9
zip_safe = False
# Ranges target InvenioRDM v13. The v13 line spans two invenio-vocabularies
# majors -- v13.0 resolves 8.x and v13.1 resolves 9.x -- so both are allowed.
install_requires =
    click>=7.0
    geojson>=2.5.0
    marshmallow-utils>=0.7.1,<1.0.0
    pycountry>=22.3.5
    PyYAML>=5.4.1
    requests>=2.25.0
    invenio-access>=4.0.0,<5.0.0
    invenio-db>=2.0.0,<3.0.0
    invenio-i18n>=3.0.0,<4.0.0
    invenio-indexer>=3.0.0,<4.0.0
    invenio-jobs>=4.0.0,<6.0.0
    invenio-pidstore>=2.0.0,<3.0.0
    # 8.6.0 is where CompositeSuggestQueryParser gained `filter_field`, which is
    # what scopes a suggestion to one scheme
    invenio-records-resources>=8.6.0,<9.0.0
    invenio-vocabularies>=8.0.0,<10.0.0

[options.extras_require]
tests =
    black>=23.12.1
    isort>=5.13.0
    pydocstyle>=6.3.0
    invenio-app>=2.0.0,<3.0.0
    invenio-db[postgresql,mysql]>=2.0.0,<3.0.0
    pytest-invenio>=3.0.0,<4.0.0
    pytest-mock>=1.6.0
opensearch2 =
    invenio-search[opensearch2]>=3.0.0,<4.0.0

[options.entry_points]
flask.commands =
    geoidentifiers = invenio_geographic_identifiers.cli:geoidentifiers
invenio_base.apps =
    geoidentifiers = invenio_geographic_identifiers:InvenioGeographicIdentifiers
invenio_base.api_apps =
    geoidentifiers = invenio_geographic_identifiers:InvenioGeographicIdentifiers
invenio_base.api_blueprints =
    geoidentifiers = invenio_geographic_identifiers.views:create_geoidentifiers_blueprint_from_app
invenio_base.finalize_app =
    geoidentifiers = invenio_geographic_identifiers.ext:finalize_app
invenio_base.api_finalize_app =
    geoidentifiers = invenio_geographic_identifiers.ext:api_finalize_app
invenio_celery.tasks =
    geoidentifiers = invenio_geographic_identifiers.tasks
invenio_jobs.jobs =
    import_geonames = invenio_geographic_identifiers.jobs:ImportGeoNamesJob
invenio_db.models =
    geoidentifiers = invenio_geographic_identifiers.geoidentifiers.models
invenio_jsonschemas.schemas =
    geoidentifiers = invenio_geographic_identifiers.geoidentifiers.jsonschemas
invenio_search.mappings =
    geoidentifiers = invenio_geographic_identifiers.geoidentifiers.mappings
invenio_db.alembic =
    invenio_geographic_identifiers = invenio_geographic_identifiers:alembic

[bdist_wheel]
universal = 1

[pydocstyle]
add_ignore = D401, D403

[compile_catalog]
directory = invenio_geographic_identifiers/translations/
use-fuzzy = True

[extract_messages]
copyright_holder = GEO Secretariat
msgid_bugs_address = secretariat@geosec.org
mapping-file = babel.ini
output-file = invenio_geographic_identifiers/translations/messages.pot
add-comments = NOTE

[init_catalog]
input-file = invenio_geographic_identifiers/translations/messages.pot
output-dir = invenio_geographic_identifiers/translations/

[update_catalog]
input-file = invenio_geographic_identifiers/translations/messages.pot
output-dir = invenio_geographic_identifiers/translations/

[isort]
profile = black

[check-manifest]
ignore =
    bootstrap*
    *-requirements.txt

[tool:pytest]
addopts = --doctest-modules --cov=invenio_geographic_identifiers --cov-report=term-missing
testpaths = tests invenio_geographic_identifiers
