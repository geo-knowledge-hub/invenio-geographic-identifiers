name: CI

on:
  push:
    branches: master
  pull_request:
    branches: master
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron: '0 3 * * 6'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason'
        required: false
        default: 'Manual trigger'

permissions:
  contents: read

jobs:
  # Style runs on its own rather than inside pytest: the plugins that would run
  # it there pin black, and black formats differently from one release to the
  # next.
  Style:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install 'black~=26.0' 'isort~=8.0' 'pydocstyle~=6.3'

      - name: Check formatting
        run: |
          black --check invenio_geographic_identifiers tests
          isort --check-only invenio_geographic_identifiers tests
          pydocstyle invenio_geographic_identifiers

  Tests:
    runs-on: ubuntu-latest

    name: Tests (InvenioRDM v13, Python 3.12)

    env:
      DB: postgresql
      SEARCH: opensearch
      MQ: redis
      # InvenioRDM v13 requires OpenSearch 2.12+: earlier releases mishandle the
      # `geo_shape` fields this vocabulary indexes. Pinned rather than left to
      # the docker-services-cli default so the floor is explicit.
      OPENSEARCH_VERSION: 2.16.0
      EXTRAS: tests,opensearch2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip wheel
          # `fs`, which arrives with invenio-files-rest, still imports
          # `pkg_resources` at module scope, and setuptools dropped that module
          # in 82.0.0. invenio-app-rdm 13.x carries the same pin.
          pip install 'setuptools<82'
          pip install ".[$EXTRAS]"
          pip freeze

      - name: Show the resolved InvenioRDM stack
        run: |
          pip show invenio-vocabularies invenio-records-resources invenio-search invenio-db \
            | grep -E '^(Name|Version):'

      - name: Run tests
        run: ./run-tests.sh
